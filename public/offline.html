<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0a0605" />
    <title>Offline · Dota Den</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #0a0605;
        color: #f3ece2;
        font-family: system-ui, sans-serif;
        text-align: center;
        padding: 24px;
      }
      p {
        color: #a89f93;
        margin: 0 0 16px;
      }
      button {
        background: #e2b04a;
        color: #1a1208;
        border: 0;
        border-radius: 6px;
        padding: 8px 16px;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" width="72" height="72" />
      <h1 style="font-size: 20px; margin: 12px 0 8px">You're offline</h1>
      <p>Dota Den needs a connection for your matches and drafts.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
