name: CI/CD

# main    -> production (https://dota-den.vercel.app)
# develop -> staging    (https://dota-den-develop.vercel.app)
# PRs     -> checks only
on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-cd-${{ github.ref }}
  # Never cancel a deploy half-way; superseded PR runs can go.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  APP_URL: http://localhost:3000
  MONGODB_URI: mongodb://127.0.0.1:27017
  MONGODB_TEST_URI: mongodb://127.0.0.1:27017

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:8
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1})'"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:integration
      - run: npm run build
      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    needs: verify
    services:
      mongo:
        image: mongo:8
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1})'"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  deploy:
    name: Deploy (${{ github.ref_name == 'main' && 'production' || 'staging' }})
    runs-on: ubuntu-latest
    needs: [verify, e2e]
    if: github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'develop')
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
      url: ${{ steps.deploy.outputs.public_url }}
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      IS_PROD: ${{ github.ref_name == 'main' }}
      PUBLIC_URL: ${{ github.ref_name == 'main' && 'https://dota-den.vercel.app' || 'https://dota-den-develop.vercel.app' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm install --global vercel@61

      - name: Pull Vercel settings
        run: |
          if [ "$IS_PROD" = "true" ]; then
            vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          else
            vercel pull --yes --environment=preview --git-branch="$GITHUB_REF_NAME" --token="$VERCEL_TOKEN"
          fi

      - name: Build
        run: vercel build $([ "$IS_PROD" = "true" ] && echo --prod) --token="$VERCEL_TOKEN"

      - name: Deploy
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt $([ "$IS_PROD" = "true" ] && echo --prod) --token="$VERCEL_TOKEN")
          echo "deployment_url=$url" >> "$GITHUB_OUTPUT"
          echo "public_url=$PUBLIC_URL" >> "$GITHUB_OUTPUT"
          echo "Deployed $url"

      - name: Point the staging domain at this deployment
        if: env.IS_PROD != 'true'
        run: >-
          vercel alias set "${{ steps.deploy.outputs.deployment_url }}"
          dota-den-develop.vercel.app --token="$VERCEL_TOKEN" --scope="$VERCEL_ORG_ID"

      - name: Apply database indexes
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DB_NAME: ${{ vars.MONGODB_DB_NAME || 'dota_den' }}
          APP_URL: ${{ env.PUBLIC_URL }}
        run: |
          if [ -z "$MONGODB_URI" ]; then
            echo "::warning::MONGODB_URI secret not set for this environment; skipping index setup."
            exit 0
          fi
          npm run db:indexes

      - name: Smoke test
        env:
          BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          for i in $(seq 1 10); do
            if [ -n "$BYPASS" ]; then
              code=$(curl -s -o /tmp/health.json -w "%{http_code}" -H "x-vercel-protection-bypass: $BYPASS" "$PUBLIC_URL/api/health")
            else
              code=$(curl -s -o /tmp/health.json -w "%{http_code}" "$PUBLIC_URL/api/health")
            fi
            echo "attempt $i: HTTP $code $(cat /tmp/health.json 2>/dev/null)"
            [ "$code" = "200" ] && exit 0
            sleep 6
          done
          echo "::error::$PUBLIC_URL/api/health did not return 200"
          exit 1
